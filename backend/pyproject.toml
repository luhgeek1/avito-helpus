[project]
name = "backend"
version = "0.1.0"
description = "FastAPI monolith template"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.41",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "email-validator>=2.3",
    "pyjwt[crypto]>=2.11",
    "argon2-cffi>=25.1",
    "redis>=7.3",
    "httpx>=0.28",
    "pydantic-ai-slim[openai]>=2.0",
    "mcp>=1.20",
    "pgvector>=0.4",
    "prometheus-client>=0.22",
    "pyyaml>=6.0",
    "aiokafka>=0.15.0",
    "tzdata ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest-cov>=7.0",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PIE", "PT", "RET",
    "SIM", "ARG", "ERA", "PL", "RUF", "S", "ASYNC", "TID", "PERF", "FAST",
]
ignore = [
    "PLR0913",  # services and factories take many keyword-only arguments on purpose
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Fakes implement protocols, so they keep parameters they do not use.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002", "PLR0917", "DTZ001", "DTZ011"]
# FastAPI calls endpoints with keyword arguments; many parameters is how DI looks there.
"app/api/**" = ["PLR0917"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
    "fastapi.Cookie",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations/env.py"]
mypy_path = "typings"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not broker'"
markers = [
    "integration: needs Postgres and Redis from docker-compose.test.yml",
    "broker: optional real Kafka test using testcontainers and Docker",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs code inside greenlets; without this those lines look uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
