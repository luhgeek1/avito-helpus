# Whole prototype in one command: `docker compose up -d --build`, then http://localhost
# API docs: http://localhost/api/docs · corp-mock admin: http://localhost:8090/admin/state
# Without LLM_API_KEY in .env Orbi runs in the marked offline mode (same tools, no LLM).
name: orbi

x-backend: &backend
  build:
    context: ./backend
  environment: &backend-env
    APP_STAGE: dev
    LOG_LEVEL: INFO
    DATABASE_URL: postgresql+asyncpg://postgres:secret@db:5432/buddy
    REDIS_URL: redis://redis:6379/0
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public_key.pem
    COOKIE_SECURE: "false"
    CORP_MCP_URL: http://corp-mock:8090/mcp
    CORP_WEBHOOK_SECRET: ${CORP_WEBHOOK_SECRET:-dev-webhook-secret}
    LLM_MODE: ${LLM_MODE:-auto}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
    LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
    LLM_HEAVY_MODEL: ${LLM_HEAVY_MODEL:-gpt-5.4}
    EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-large}
    ACCESS_SLA_HOURS: ${ACCESS_SLA_HOURS:-24}
    ESCALATION_SLA_HOURS: ${ESCALATION_SLA_HOURS:-24}
    SCHEDULER_INTERVAL_SEC: ${SCHEDULER_INTERVAL_SEC:-15}
    CLICKSTREAM_ENABLED: ${CLICKSTREAM_ENABLED:-false}
    CLICKSTREAM_HMAC_KEY_PATH: /app/secrets/clickstream_hmac_key
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    WORKER_METRICS_PORT: "9100"
  volumes:
    - jwt_keys:/app/secrets
  restart: unless-stopped

services:
  migrate:
    <<: *backend
    # Keys (first run only), schema, then the demo company (idempotent).
    command: ["sh", "-c", "python -m app.cli keys --dir /app/secrets && python -m app.cli telemetry-keys --dir /app/secrets && alembic upgrade head && python -m app.cli seed"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      corp-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    expose:
      - "9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      corp-mock:
        condition: service_healthy

  corp-mock:
    build:
      context: ./corp-mock
    environment:
      MOCK_APPROVAL_DELAY_SEC: ${MOCK_APPROVAL_DELAY_SEC:-20}
      BUDDY_WEBHOOK_URL: http://api:8080/api/v1/integrations/corp/webhook
      CORP_WEBHOOK_SECRET: ${CORP_WEBHOOK_SECRET:-dev-webhook-secret}
      CORP_STATE_FILE: /data/state.json
    volumes:
      - corp_state:/data
    ports:
      - "8090:8090"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: deploy/home/web.Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: buddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buddy"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  observability-init:
    <<: *backend
    profiles: [observability]
    command: ["python", "-m", "app.cli", "observability-init"]
    volumes:
      - observability_credentials:/run/observability
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9095:9090"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observability]
    # Anonymous Viewer is for local synthetic demos only. Admin credentials are generated.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/observability/admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'export GRAFANA_DB_PASSWORD="$$(cat /run/observability/db_password)"; exec /run.sh'
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - observability_credentials:/run/observability:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      observability-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    profiles: [clickstream]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.4.0
    profiles: [clickstream]
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "buddy.analytics.v1", "--partitions", "3", "--replication-factor", "1", "--config", "retention.ms=604800000"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  clickstream:
    <<: *backend
    profiles: [clickstream]
    command: ["python", "-m", "app.cli", "clickstream-consume"]
    volumes:
      - jwt_keys:/app/secrets:ro
      - clickstream_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  jwt_keys:
  corp_state:
  observability_credentials:
  prometheus_data:
  grafana_data:
  kafka_data:
  clickstream_data:
