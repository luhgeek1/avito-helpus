[project]
name = "corp-mock"
version = "1.0.0"
description = "MCP imitation of Avito-like corporate services for the Orbi prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.28",
    "uvicorn[standard]>=0.41",
    "tzdata ; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
