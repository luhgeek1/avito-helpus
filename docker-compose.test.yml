# Throwaway dependencies for integration tests: `make test` starts them, runs pytest, removes them.
# Ports differ from docker-compose.yml so tests can run next to the dev stack.
services:
  postgres-test:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: buddy_test
    ports:
      - "5439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buddy_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
