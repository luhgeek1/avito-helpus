name: Deploy to Sara

# One workflow for the whole stack: checks, four images (api, corpmock, web, edge), deploy of main.
# Every run builds every image so that any commit SHA is deployable (layers are cached).
on:
  push:
    branches: [main, deploy/home-server]
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'frontend/design/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-home
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --locked
      - name: Lint and types
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Tests (Postgres with pgvector and Redis in Docker)
        run: |
          docker compose -p buddy-test -f docker-compose.test.yml up -d --wait
          cd backend && uv run pytest -q

  frontend-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx next typegen
          npm run typecheck
          npm test
          npm run check:architecture

  build:
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: backend
            dockerfile: backend/Dockerfile
          - image: corpmock
            context: corp-mock
            dockerfile: corp-mock/Dockerfile
          - image: web
            context: frontend
            dockerfile: frontend/deploy/home/web.Dockerfile
          - image: edge
            context: deploy/home
            dockerfile: deploy/home/edge.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/luhgeek1/avito-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=avito-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=avito-${{ matrix.image }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.SARA_TAILSCALE_IP }}
      - name: Trust only the pinned server host key
        env:
          SERVER: ${{ vars.SARA_TAILSCALE_IP }}
          HOST_KEY: ${{ vars.SARA_HOST_KEY }}
          DEPLOY_KEY: ${{ secrets.SARA_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s %s\n' "$SERVER" "$HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy ${{ github.sha }}
        env:
          SERVER: ${{ vars.SARA_TAILSCALE_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            mark@"$SERVER" "avito $GITHUB_SHA"
      - name: Public smoke check
        env:
          HOST: ${{ vars.AVITO_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 --max-time 10 "https://$HOST/healthz" | jq -e '.status == "ok"' >/dev/null \
              && curl -fsS --connect-timeout 5 --max-time 10 "https://$HOST/api/health" | jq -e '.status == "ok"' >/dev/null; then
              curl -fsS --connect-timeout 5 --max-time 20 "https://$HOST/pets?pet=orbit" >/dev/null
              echo "https://$HOST is up"
              exit 0
            fi
            sleep 6
          done
          echo "Public health check failed"
          exit 1
