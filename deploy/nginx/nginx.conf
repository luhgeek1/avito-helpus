# One origin for the jury: Next.js portal on /, Orbi API on /api/v1 (cookies and SSE just work).
# Docker's DNS with a short TTL: containers restarted with new IPs are found again.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 2m;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:3000;

    # Chat answers and realtime events are Server-Sent Events: never buffer them.
    location ~ ^/api/v1/(chat/conversations/[^/]+/(messages|actions/[^/]+)|events)$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/(v1/|health$|ready$|docs|openapi\.json$) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus scrapes the API directly inside the network; not exposed publicly.
    location = /api/metrics { return 404; }

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
