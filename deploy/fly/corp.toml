# Simulated corporate services (MCP), private only. CORP_WEBHOOK_SECRET is a secret.
# Tickets and grants live on a volume, so ticket numbers survive deploys like Orbi's database does.
app = "avito-orbi-corp"
primary_region = "fra"

[build]
  image = "ghcr.io/luhgeek1/avito-corpmock:latest"

[env]
  MOCK_APPROVAL_DELAY_SEC = "20"
  BUDDY_WEBHOOK_URL = "http://avito-orbi-api.internal:8080/api/v1/integrations/corp/webhook"
  CORP_STATE_FILE = "/data/state.json"

[mounts]
  source = "corp_state"
  destination = "/data"

[processes]
  app = "sh -c 'chown app:app /data 2>/dev/null; exec uvicorn corp_mock.server:app --host :: --port 8090'"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
