# Edge on Fly.io: one origin for the portal (/) and the Orbi API (/api).
# Fly proxy terminates TLS; apps talk over the private 6PN network (<app>.internal, IPv6).
resolver [fdaa::3]:53 valid=10s;

# Behind the Fly proxy the original scheme arrives in X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 8080;
    listen [::]:8080;
    client_max_body_size 2m;
    set $api_upstream http://avito-orbi-api.internal:8080;
    set $site_upstream http://avito-orbi-site.internal:3000;

    location = /edge-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Chat answers and realtime events are Server-Sent Events: never buffer them.
    location ~ ^/api/v1/(chat/conversations/[^/]+/(messages|actions/[^/]+)|events)$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/(v1/|health$|ready$|docs|openapi\.json$) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Prometheus metrics stay inside the private network.
    location = /api/metrics { return 404; }

    location / {
        proxy_pass $site_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
